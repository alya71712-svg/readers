<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="القوارئ العشر">
<meta name="google" content="notranslate">

<title>القوارئ العشر | مكتبة القرآن كُتب في الإسكندرية</title>
<style>
:root{--font-size:15px;--bg:#f7f1e7;--paper:#fffdf8;--ink:#463728;--muted:#7a6a58;--accent:#8b4e3a;--accent2:#6e3b2b;--line:#ddc8a8;--cell:#fff;--soft:#fff4df;--shadow:0 14px 40px rgba(15,23,42,.10)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;padding:18px;background:var(--bg);color:var(--ink);font-family:"Tajawal",Tahoma,Arial,sans-serif;transition:background .25s,color .25s}
.app{max-width:1280px;margin:auto;position:relative}
.paper{background:var(--paper);border:1px solid color-mix(in srgb,var(--line) 70%,transparent);border-radius:22px;box-shadow:var(--shadow);overflow:hidden}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:20px 24px;border-bottom:1px solid var(--line);background:linear-gradient(135deg,var(--paper),var(--soft))}
.brand{display:flex;align-items:center;gap:13px}
.brand-mark{width:44px;height:44px;display:grid;place-items:center;border-radius:14px;background:var(--accent);color:#fff;font-size:23px;box-shadow:0 8px 18px color-mix(in srgb,var(--accent) 35%,transparent)}
h1{font-size:clamp(20px,3vw,30px);margin:0 0 4px}
.subtitle{margin:0;color:var(--muted);font-size:13px}
.date-box{text-align:left;white-space:nowrap}
.date-label{font-size:12px;color:var(--muted);display:block}
.today{font-weight:800;font-size:18px;color:var(--accent)}
.font-control{position:relative}
.font-button{width:38px;height:38px;padding:0;border-radius:10px;font-size:18px;background:var(--soft);color:var(--accent);border:1px solid var(--line)}
.font-menu{display:none;position:absolute;top:44px;left:0;z-index:12;min-width:150px;padding:10px;background:var(--paper);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);text-align:center}
.font-menu.open{display:block}
.font-menu-title{display:block;margin-bottom:7px;color:var(--muted);font-size:12px}
.font-actions{display:flex;align-items:center;justify-content:center;gap:8px}
.font-actions button{padding:6px 11px}
.font-value{min-width:45px;font-weight:800;color:var(--accent)}
.layout{display:grid;grid-template-columns:1fr 250px;gap:20px;padding:22px}
.workspace{min-width:0}
.section-title{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 0 14px}
.section-title h2{margin:0;font-size:20px}
.hint{font-size:12px;color:var(--muted)}
button{border:0;border-radius:11px;padding:10px 15px;font:inherit;font-size:14px;font-weight:700;cursor:pointer;background:var(--accent);color:#fff;transition:transform .15s,filter .15s,background .15s}
button:hover{filter:brightness(1.06);transform:translateY(-1px)}
button.secondary{background:color-mix(in srgb,var(--muted) 85%,#000)}
button.ghost{background:var(--soft);color:var(--accent);border:1px solid color-mix(in srgb,var(--accent) 20%,var(--line))}
.search-row{display:flex;gap:9px;margin:0 0 14px}
.search-row input{flex:1;min-width:0;padding:11px 14px;border:1px solid var(--line);border-radius:12px;background:var(--cell);color:var(--ink);font:inherit;font-size:15px;outline:0}
.search-row input:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 20%,transparent)}
.resume{display:none;align-items:center;justify-content:space-between;gap:12px;margin:0 0 16px;padding:13px 16px;border:1px solid color-mix(in srgb,var(--accent) 40%,var(--line));border-radius:14px;background:var(--soft)}
.resume.show{display:flex}
.resume b{color:var(--accent)}
.resume small{display:block;color:var(--muted);margin-top:3px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.card{position:relative;display:flex;flex-direction:column;gap:9px;padding:16px 16px 14px;border:1px solid var(--line);border-radius:16px;background:var(--cell);overflow:hidden;color:inherit;text-decoration:none;transition:transform .15s,box-shadow .15s,border-color .15s}
.card::before{content:"";position:absolute;inset:0 0 auto 0;height:5px;background:var(--card-accent,var(--accent))}
.card:hover{transform:translateY(-3px);box-shadow:var(--shadow);border-color:var(--card-accent,var(--accent))}
.card:focus-visible{outline:3px solid color-mix(in srgb,var(--accent) 45%,transparent);outline-offset:2px}
.card-top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:4px}
.num{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:var(--card-accent,var(--accent));color:#fff;font-weight:800;font-size:14px}
.badge{font-size:11px;padding:3px 9px;border-radius:999px;background:var(--soft);color:var(--card-accent,var(--accent));font-weight:800;border:1px solid var(--line)}
.badge.last{background:var(--card-accent,var(--accent));color:#fff;border-color:transparent}
.badge.missing{background:#fee2e2;color:#b91c1c;border-color:#fecaca}
.card h3{margin:2px 0 0;font-size:calc(var(--font-size) + 3px);line-height:1.4}
.card p{margin:0;font-size:calc(var(--font-size) - 2px);line-height:1.7;color:var(--muted);flex:1}
.card-foot{display:flex;align-items:center;justify-content:space-between;gap:8px;padding-top:9px;border-top:1px dashed var(--line);font-size:12px;color:var(--muted)}
.card-foot .open{color:var(--card-accent,var(--accent));font-weight:800;font-size:14px}
.card.missing{opacity:.62}
.empty{padding:22px;border:1px dashed var(--line);border-radius:12px;color:var(--muted);text-align:center;grid-column:1/-1}
.control-panel{border:1px solid var(--line);border-radius:18px;padding:14px;background:color-mix(in srgb,var(--paper) 88%,var(--soft));height:max-content;position:sticky;top:12px}
.panel-heading{display:flex;align-items:center;justify-content:space-between;margin-bottom:11px}
.panel-heading h3{margin:0;font-size:16px}
.panel-toggle{position:absolute;top:11px;right:-1px;transform:translateX(100%);width:38px;height:38px;padding:0;border-radius:0 11px 11px 0;display:grid;place-items:center;background:var(--accent);font-size:18px}
.nav-grid{display:grid;grid-template-columns:1fr;gap:7px}
.nav-btn{width:100%;display:flex;align-items:center;gap:10px;justify-content:flex-start;margin:0;background:transparent;color:var(--ink);border:1px solid var(--line)}
.nav-btn:hover{background:var(--soft);color:var(--accent);border-color:color-mix(in srgb,var(--accent) 40%,var(--line))}
.nav-icon{font-size:18px;width:24px;text-align:center}
.panel-note{font-size:12px;line-height:1.7;color:var(--muted);border-top:1px solid var(--line);margin-top:14px;padding-top:12px}
.modal-backdrop{position:fixed;inset:0;background:rgba(15,23,42,.45);display:none;align-items:center;justify-content:center;padding:18px;z-index:20}
.modal-backdrop.open{display:flex}
.modal{width:min(760px,100%);max-height:90vh;overflow:auto;background:var(--paper);border-radius:20px;box-shadow:0 25px 70px rgba(0,0,0,.25);padding:22px}
.modal-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}
.modal-head h2{margin:0;font-size:22px}
.close{background:transparent;color:var(--muted);font-size:24px;padding:3px 10px}
.modal-footer{margin-top:16px;display:flex;justify-content:flex-start;gap:9px}
.theme-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.theme-card{border:2px solid var(--line);background:var(--cell);color:var(--ink);padding:12px;border-radius:14px;text-align:right}
.theme-card.selected{border-color:var(--accent)}
.swatches{display:flex;gap:5px;margin-bottom:9px}
.swatches i{height:28px;flex:1;border-radius:6px}
.steps{margin:0;padding:0 20px 0 0;line-height:2}
.steps code{direction:ltr;unicode-bidi:isolate;background:var(--soft);padding:1px 7px;border-radius:6px;font-size:13px}
.stat-row{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px dashed var(--line)}
.status{min-height:20px;margin-top:10px;font-size:13px;color:var(--accent)}
body.panel-hidden .layout{grid-template-columns:1fr}
body.panel-hidden .control-panel{display:none}
body.panel-hidden .panel-toggle{position:fixed;right:0;top:50%;transform:translateY(-50%);border-radius:11px 0 0 11px;z-index:10}
@media(max-width:760px){
  body{padding:8px}
  .topbar{padding:16px;align-items:flex-start;flex-wrap:wrap}
  .date-box{text-align:right}
  .layout{padding:13px;display:block}
  .control-panel{position:static;margin-top:18px}
  .panel-toggle{right:12px;top:12px;transform:none;border-radius:11px}
  .brand-mark{width:38px;height:38px}
  .today{font-size:15px}
  .grid{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div class="app">
  <div class="paper">
    <header class="topbar">
      <div class="brand"><div class="brand-mark">📖</div><div><h1>القوارئ العشر</h1><p class="subtitle">مكتبة مشروع «القرآن كُتب في الإسكندرية» — قارئ لكل مؤلف أو موضوع</p></div></div>
      <div class="date-box"><span class="date-label">تاريخ اليوم</span><span class="today" id="today"></span></div>
      <div class="font-control"><button class="font-button" type="button" onclick="toggleFontMenu()" title="التحكم في حجم الخط" aria-label="التحكم في حجم الخط">A</button><div class="font-menu" id="fontMenu"><span class="font-menu-title">حجم خط البطاقات</span><div class="font-actions"><button type="button" onclick="changeFontSize(-1)">−</button><span class="font-value" id="fontValue">15</span><button type="button" onclick="changeFontSize(1)">+</button></div></div></div>
    </header>
    <main class="layout">
      <section class="workspace">
        <div class="resume" id="resume"><div><b id="resumeTitle"></b><small id="resumeWhen"></small></div><button type="button" id="resumeBtn">تابع القراءة</button></div>
        <div class="section-title"><h2>اختر القارئ</h2><span class="hint" id="countHint"></span></div>
        <div class="search-row"><input id="q" type="search" placeholder="ابحث باسم القارئ أو المؤلف أو الموضوع…" autocomplete="off" aria-label="بحث في القوارئ"></div>
        <div class="grid" id="grid"></div>
        <div class="status" id="status" role="status"></div>
      </section>
      <aside class="control-panel" id="controlPanel">
        <div class="panel-heading"><h3>لوحة التحكم</h3><span>☰</span></div>
        <div class="nav-grid">
          <button class="nav-btn" type="button" onclick="openThemes()"><span class="nav-icon">◐</span>السيمات</button>
          <button class="nav-btn" type="button" onclick="openStats()"><span class="nav-icon">▦</span>إحصاءات المكتبة</button>
          <button class="nav-btn" type="button" onclick="openAdd()"><span class="nav-icon">✎</span>كيف أضيف أو أغيّر قارئاً</button>
          <button class="nav-btn" type="button" onclick="recheck()"><span class="nav-icon">⟳</span>إعادة فحص الملفات</button>
          <button class="nav-btn" type="button" onclick="openCloud()"><span class="nav-icon">☁</span>المزامنة السحابية</button>
        </div>
        <div class="panel-note">كل قارئ يحفظ علاماته وملاحظاته وتظليله ومكان توقفك على هذا المتصفح، وتُنسخ سحابياً عند تفعيل «المزامنة السحابية» لتظهر على أي جهاز.</div>
      </aside>
    </main>
  </div>
  <button class="panel-toggle" id="togglePanel" type="button" onclick="togglePanel()" title="إظهار أو إخفاء لوحة التحكم" aria-label="إظهار أو إخفاء لوحة التحكم">☰</button>
</div>

<div class="modal-backdrop" id="modalBackdrop" onclick="backdropClose(event)"><div class="modal" id="modal"></div></div>

const K_THEME='readers_theme',K_FONT='readers_font',K_LAST='readers_last',K_PANEL='readers_panel_hidden';
const $=s=>document.querySelector(s);
const grid=$('#grid'),qEl=$('#q'),statusEl=$('#status'),modalBackdrop=$('#modalBackdrop'),modal=$('#modal');
const store={get(k){try{return localStorage.getItem(k)}catch{return null}},set(k,v){try{localStorage.setItem(k,v)}catch{}}};
let availability={};   // id -> true | false | undefined (لم يُفحص)

function el(tag,props={},kids=[]){
  const n=document.createElement(tag);
  for(const [k,v] of Object.entries(props)){
    if(k==='class')n.className=v;
    else if(k==='text')n.textContent=v;
    else if(k.startsWith('on'))n.addEventListener(k.slice(2),v);
    else n.setAttribute(k,v);
  }
  [].concat(kids).forEach(c=>c&&n.appendChild(typeof c==='string'?document.createTextNode(c):c));
  return n;
}
const norm=s=>String(s||'').toLowerCase().replace(/[ً-ٰٟـ]/g,'').replace(/[أإآ]/g,'ا').replace(/ى/g,'ي').replace(/ة/g,'ه');
function getDetail(){try{const v=JSON.parse(store.get('readers_last_detail')||'null');return v&&v.file?v:null}catch{return null}}
function getLast(){
  let v=null;try{v=JSON.parse(store.get(K_LAST)||'null');if(!(v&&v.id))v=null}catch{v=null}
  // لو سجّل أحد القوارئ موضعاً أحدث (آخر كتاب وفقرة) نعتمده — ويحمل اسم الكتاب ورقم الفقرة
  const d=getDetail(),r=d&&READERS.find(x=>x.file.split('/').pop()===d.file);
  if(r&&(!v||d.ts>=v.ts))return {id:r.id,ts:d.ts,detail:d};
  if(v&&d&&READERS.find(x=>x.id===v.id)?.file.split('/').pop()===d.file)v.detail=d;
  return v;
}
function ago(ts){
  const m=Math.round((Date.now()-ts)/60000);
  if(m<1)return 'الآن';
  if(m<60)return `منذ ${m} دقيقة`;
  const h=Math.round(m/60);
  if(h<24)return `منذ ${h} ساعة`;
  return `منذ ${Math.round(h/24)} يوم`;
}

// ---------- العرض ----------
function render(){
  const q=norm(qEl.value.trim()),last=getLast();
  const list=READERS.filter(r=>!q||norm([r.title,r.sub,r.desc].join(' ')).includes(q));
  grid.replaceChildren();
  if(!list.length)grid.appendChild(el('div',{class:'empty',text:'لا توجد نتائج مطابقة للبحث.'}));
  list.forEach(r=>{
    const idx=READERS.indexOf(r)+1,missing=availability[r.id]===false;
    const badge=missing?el('span',{class:'badge missing',text:'الملف غير موجود'}):(last&&last.id===r.id?el('span',{class:'badge last',text:'آخر ما قرأت'}):el('span',{class:'badge',text:r.texts?`${r.texts} نصاً`:'فارغ'}));
    const a=el('a',{class:'card'+(missing?' missing':''),href:r.file,style:`--card-accent:${r.accent}`,'data-id':r.id,onclick:()=>markOpened(r)},[
      el('div',{class:'card-top'},[el('span',{class:'num',text:String(idx)}),badge]),
      el('h3',{text:r.title}),
      el('p',{text:r.desc}),
      el('div',{class:'card-foot'},[el('span',{text:r.sub,dir:'ltr'}),el('span',{class:'open',text:'فتح القارئ ←'})])
    ]);
    grid.appendChild(a);
  });
  $('#countHint').textContent=q?`${list.length} من ${READERS.length}`:`${READERS.length} قوارئ`;
  renderResume();
}
function renderResume(){
  const last=getLast(),r=last&&READERS.find(x=>x.id===last.id),box=$('#resume');
  if(!r){box.classList.remove('show');return}
  $('#resumeTitle').textContent=r.title;
  const d=last.detail;
  $('#resumeWhen').textContent=d&&(d.title||d.pid)
    ?['الكتاب: '+(d.title||'—'),d.pid?'الفقرة '+d.pid:'','آخر قراءة: '+ago(d.ts||last.ts)].filter(Boolean).join(' — ')
    :'آخر فتح: '+ago(last.ts);
  $('#resumeBtn').onclick=()=>{markOpened(r);location.href=r.file};
  box.classList.add('show');
}
function markOpened(r){store.set(K_LAST,JSON.stringify({id:r.id,ts:Date.now()}))}

// ---------- فحص وجود الملفات (على الاستضافة فقط) ----------
async function checkFiles(){
  if(!/^https?:$/.test(location.protocol))return;
  statusEl.textContent='جارٍ فحص ملفات القوارئ…';
  await Promise.all(READERS.map(async r=>{
    try{
      const res=await fetch(r.file,{method:'HEAD',cache:'no-store'});
      availability[r.id]=res.ok;
    }catch{availability[r.id]=undefined}
  }));
  const missing=READERS.filter(r=>availability[r.id]===false).length;
  statusEl.textContent=missing?`⚠ ${missing} من الملفات غير موجودة في مجلد readers — راجع «كيف أضيف أو أغيّر قارئاً».`:'';
  render();
}
function recheck(){availability={};render();checkFiles()}

// ---------- السيمات ----------
function applyTheme(key){
  const t=themes[key]||themes.earth,s=document.documentElement.style;
  s.setProperty('--bg',t.bg);s.setProperty('--paper',t.paper);s.setProperty('--ink',t.ink);
  s.setProperty('--accent',t.accent);s.setProperty('--accent2',t.accent2);s.setProperty('--line',t.line);
  s.setProperty('--soft',t.soft);s.setProperty('--cell',t.cell||'#fff');
  s.setProperty('--muted',`color-mix(in srgb,${t.ink} 62%,${t.paper})`);
  const m=document.querySelector('meta[name="theme-color"]');if(m)m.content=t.accent;
  store.set(K_THEME,key);
}
function openThemes(){
  const cur=store.get(K_THEME)||'earth';
  const g=el('div',{class:'theme-grid'});
  Object.entries(themes).forEach(([key,t])=>{
    g.appendChild(el('button',{type:'button',class:'theme-card'+(key===cur?' selected':''),onclick:()=>{applyTheme(key);openThemes()}},[
      el('div',{class:'swatches'},[t.bg,t.paper,t.accent,t.soft].map(c=>el('i',{style:`background:${c};border:1px solid ${t.line}`}))),
      el('span',{text:t.name})
    ]));
  });
  openModal('السيمات',g);
}

// ---------- الخط واللوحة ----------
function setFont(n){n=Math.max(12,Math.min(24,n));document.documentElement.style.setProperty('--font-size',n+'px');$('#fontValue').textContent=n;store.set(K_FONT,String(n))}
function changeFontSize(d){setFont((Number(store.get(K_FONT))||15)+d)}
function toggleFontMenu(){$('#fontMenu').classList.toggle('open')}
function togglePanel(){const h=document.body.classList.toggle('panel-hidden');store.set(K_PANEL,h?'1':'0')}

// ---------- النوافذ ----------
function openModal(title,body,footer){
  modal.replaceChildren(
    el('div',{class:'modal-head'},[el('h2',{text:title}),el('button',{class:'close',type:'button',onclick:closeModal,'aria-label':'إغلاق',text:'×'})]),
    body,
    footer||el('div',{class:'modal-footer'},[el('button',{class:'secondary',type:'button',onclick:closeModal,text:'إغلاق'})])
  );
  modalBackdrop.classList.add('open');
}
function closeModal(){modalBackdrop.classList.remove('open')}
function backdropClose(e){if(e.target===modalBackdrop)closeModal()}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});

function openStats(){
  const total=READERS.reduce((s,r)=>s+(r.texts||0),0),filled=READERS.filter(r=>r.texts>0).length;
  const row=(a,b)=>el('div',{class:'stat-row'},[el('span',{text:a}),el('b',{text:String(b)})]);
  const body=el('div',{},[row('عدد القوارئ',READERS.length),row('قوارئ فيها نصوص',filled),row('مجموع النصوص',total)]);
  READERS.filter(r=>r.texts>0).sort((a,b)=>b.texts-a.texts).forEach(r=>body.appendChild(row(r.title,r.texts)));
  openModal('إحصاءات المكتبة',body);
}
function openCloud(){
  const RC=window.ReaderCloud;
  if(!RC||!RC.configured()){
    openModal('المزامنة السحابية',el('div',{},[
      el('p',{text:'المزامنة السحابية غير مفعّلة بعد. أنشئي الجدول في Supabase بتشغيل ملف supabase-setup.sql مرة واحدة، ثم ضعي المفتاح العام (Publishable key) في ملف cloud-config.js.'}),
      el('p',{text:'إلى ذلك الحين تعمل القوارئ كما كانت: الحفظ على هذا المتصفح فقط.'})
    ]));
    return;
  }
  const st=RC.status(), code=RC.getCode();
  const msg=el('div',{class:'status',role:'status',style:'min-height:20px;margin:8px 0'});
  const say=t=>{msg.textContent=t};
  const body=el('div',{});
  const fmt=c=>c.replace(/(.{5})(?=.)/g,'$1-');
  if(!code){
    const inp=el('input',{type:'text',placeholder:'الصقي هنا رمز المزامنة من جهازك الآخر',dir:'ltr',autocomplete:'off',style:'width:100%;padding:10px;margin:6px 0;border-radius:10px;border:1px solid var(--line)'});
    body.append(
      el('p',{text:'الرمز السرّي هو مفتاح بياناتك: من يملكه يصل إلى إشاراتك وتظليلك. لا حاجة لحساب أو كلمة مرور.'}),
      el('button',{type:'button',text:'إنشاء رمز لهذا الجهاز (أول مرة)',onclick:async()=>{
        RC.setCode(RC.genCode()); say('جارٍ رفع بياناتك الحالية…');
        const r=await RC.syncAll(); const ok=r.filter(x=>x.ok).length;
        say(ok===r.length?'✓ تم الرفع. احفظي الرمز الظاهر الآن ثم أدخليه في أجهزتك الأخرى.':'⚠ تعذّر رفع '+(r.length-ok)+' قارئ — تحقق من الاتصال وأعيدي المحاولة.');
        openCloud();
      }}),
      el('hr'),
      el('p',{text:'لديّ رمز من جهاز آخر:'}), inp,
      el('button',{type:'button',class:'secondary',text:'ربط هذا الجهاز وسحب بياناتي',onclick:async()=>{
        if(!RC.setCode(inp.value)){say('الرمز غير صالح — 20 حرفاً/رقماً (تُهمل الشرطات والمسافات).');return}
        say('جارٍ الدمج مع السحابة…');
        const r=await RC.syncAll(); const ok=r.filter(x=>x.ok).length;
        say(ok===r.length?'✓ تم الربط ودُمجت بياناتك مع السحابة.':'⚠ تعذّرت مزامنة '+(r.length-ok)+' قارئ.');
        openCloud();
      }}),
      msg
    );
  }else{
    const shown=el('code',{text:'•••••-•••••-•••••-•••••',dir:'ltr',style:'font-size:17px;letter-spacing:1px'});
    let vis=false;
    body.append(
      el('p',{text:'هذا الجهاز مرتبط بالسحابة. أدخلي الرمز نفسه في أي جهاز آخر لترَي الإشارات والتظليل نفسها.'}),
      el('div',{style:'margin:8px 0'},[shown]),
      el('div',{class:'modal-footer',style:'justify-content:flex-start;gap:8px;flex-wrap:wrap'},[
        el('button',{type:'button',class:'secondary',text:'إظهار/إخفاء الرمز',onclick:()=>{vis=!vis;shown.textContent=vis?fmt(code):'•••••-•••••-•••••-•••••'}}),
        el('button',{type:'button',class:'secondary',text:'نسخ الرمز',onclick:async()=>{try{await navigator.clipboard.writeText(fmt(code));say('✓ نُسخ الرمز')}catch{say('تعذّر النسخ — أظهري الرمز وانسخيه يدوياً')}}})
      ]),
      el('p',{text:st.lastOk?('آخر مزامنة ناجحة من قارئ مفتوح: '+ago(st.lastOk)):'يزامن كل قارئ نفسه تلقائياً عند فتحه وبعد كل تظليل أو إشارة.'}),
      el('button',{type:'button',text:'مزامنة كل القوارئ الآن',onclick:async()=>{
        say('جارٍ المزامنة…');
        const r=await RC.syncAll((i,n)=>say('جارٍ المزامنة… '+i+' / '+n)); const ok=r.filter(x=>x.ok).length;
        say(ok===r.length?'✓ تمت مزامنة القوارئ العشر.':'⚠ نجحت '+ok+' من '+r.length+' — أعيدي المحاولة عند توفر اتصال أفضل.');
      }}),
      el('hr'),
      el('button',{type:'button',class:'secondary',text:'فصل هذا الجهاز عن السحابة',onclick:()=>{
        if(confirm('سيتوقف هذا الجهاز عن المزامنة، وتبقى بياناته المحلية كما هي وبياناتك في السحابة لا تُحذف. متابعة؟')){RC.clearCode();openCloud()}
      }}),
      msg
    );
  }
  openModal('المزامنة السحابية',body);
}
function openAdd(){
  const li=t=>el('li',{},[t]);
  const code=t=>el('code',{text:t});
  const body=el('div',{},[
    el('ol',{class:'steps'},[
      el('li',{},['ضع ملف كل قارئ داخل مجلد ',code('readers'),' بجانب ',code('index.html'),' (المستودع نفسه على GitHub).']),
      li('أسماء الملفات المتوقعة مكتوبة في القائمة READERS أعلى الكود في index.html (حقل file).'),
      li('لتغيير اسم قارئ أو وصفه أو لونه أو عدد نصوصه: عدّل سطره في تلك القائمة فقط.'),
      li('لإضافة قارئ جديد: انسخ سطراً كاملاً وغيّر id وtitle وfile.'),
      li('الملفات الأكبر من 25 ميجا لا يقبلها GitHub عبر الواجهة؛ استخدم الرفع من تطبيق Git أو GitHub Desktop.')
    ])
  ]);
  openModal('كيف أضيف أو أغيّر قارئاً',body);
}

// ---------- البدء ----------
(function init(){
  $('#today').textContent=new Date().toLocaleDateString('ar-EG',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
  applyTheme(store.get(K_THEME)||'earth');
  setFont(Number(store.get(K_FONT))||15);
  if(store.get(K_PANEL)==='1')document.body.classList.add('panel-hidden');
  qEl.addEventListener('input',render);
  render();
  checkFiles();
})();
</script>
