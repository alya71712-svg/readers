<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#8b4e3a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="القوارئ العشر">
<meta name="google" content="notranslate">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="./icon.svg">
<title>القوارئ العشر | مشروع القراء العشر</title>
<style>
:root{--font-size:15px;--bg:#f7f1e7;--paper:#fffdf8;--ink:#463728;--muted:#7a6a58;--accent:#8b4e3a;--accent2:#6e3b2b;--line:#ddc8a8;--cell:#fff;--soft:#fff4df;--shadow:0 14px 40px rgba(15,23,42,.10)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;padding:18px;background:var(--bg);color:var(--ink);font-family:"Tajawal",Tahoma,Arial,sans-serif;transition:background .25s,color .25s}
.app{max-width:1280px;margin:auto;position:relative}
.paper{background:var(--paper);border:1px solid color-mix(in srgb,var(--line) 70%,transparent);border-radius:22px;box-shadow:var(--shadow);overflow:hidden}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:20px 24px;border-bottom:1px solid var(--line);background:linear-gradient(135deg,var(--paper),var(--soft))}
.brand{display:flex;align-items:center;gap:13px}
.brand-mark{width:44px;height:44px;display:grid;place-items:center;border-radius:14px;background:var(--accent);color:#fff;font-size:23px;box-shadow:0 8px 18px color-mix(in srgb,var(--accent) 35%,transparent)}
h1{font-size:clamp(20px,3vw,30px);margin:0 0 4px}
.subtitle{margin:0;color:var(--muted);font-size:13px}
.date-box{text-align:left;white-space:nowrap}
.date-label{font-size:12px;color:var(--muted);display:block}
.today{font-weight:800;font-size:18px;color:var(--accent)}
.font-control{position:relative}
.font-button{width:38px;height:38px;padding:0;border-radius:10px;font-size:18px;background:var(--soft);color:var(--accent);border:1px solid var(--line)}
.font-menu{display:none;position:absolute;top:44px;left:0;z-index:12;min-width:150px;padding:10px;background:var(--paper);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);text-align:center}
.font-menu.open{display:block}
.font-menu-title{display:block;margin-bottom:7px;color:var(--muted);font-size:12px}
.font-actions{display:flex;align-items:center;justify-content:center;gap:8px}
.font-actions button{padding:6px 11px}
.font-value{min-width:45px;font-weight:800;color:var(--accent)}
.layout{display:grid;grid-template-columns:1fr 250px;gap:20px;padding:22px}
.workspace{min-width:0}
.section-title{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 0 14px}
.section-title h2{margin:0;font-size:20px}
.hint{font-size:12px;color:var(--muted)}
button{border:0;border-radius:11px;padding:10px 15px;font:inherit;font-size:14px;font-weight:700;cursor:pointer;background:var(--accent);color:#fff;transition:transform .15s,filter .15s,background .15s}
button:hover{filter:brightness(1.06);transform:translateY(-1px)}
button.secondary{background:color-mix(in srgb,var(--muted) 85%,#000)}
button.ghost{background:var(--soft);color:var(--accent);border:1px solid color-mix(in srgb,var(--accent) 20%,var(--line))}
.search-row{display:flex;gap:9px;margin:0 0 14px}
.search-row input{flex:1;min-width:0;padding:11px 14px;border:1px solid var(--line);border-radius:12px;background:var(--cell);color:var(--ink);font:inherit;font-size:15px;outline:0}
.search-row input:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 20%,transparent)}
.resume{display:none;align-items:center;justify-content:space-between;gap:12px;margin:0 0 16px;padding:13px 16px;border:1px solid color-mix(in srgb,var(--accent) 40%,var(--line));border-radius:14px;background:var(--soft)}
.resume.show{display:flex}
.resume b{color:var(--accent)}
.resume small{display:block;color:var(--muted);margin-top:3px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.card{position:relative;display:flex;flex-direction:column;gap:9px;padding:16px 16px 14px;border:1px solid var(--line);border-radius:16px;background:var(--cell);overflow:hidden;color:inherit;text-decoration:none;transition:transform .15s,box-shadow .15s,border-color .15s}
.card::before{content:"";position:absolute;inset:0 0 auto 0;height:5px;background:var(--card-accent,var(--accent))}
.card:hover{transform:translateY(-3px);box-shadow:var(--shadow);border-color:var(--card-accent,var(--accent))}
.card:focus-visible{outline:3px solid color-mix(in srgb,var(--accent) 45%,transparent);outline-offset:2px}
.card-top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:4px}
.num{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:var(--card-accent,var(--accent));color:#fff;font-weight:800;font-size:14px}
.badge{font-size:11px;padding:3px 9px;border-radius:999px;background:var(--soft);color:var(--card-accent,var(--accent));font-weight:800;border:1px solid var(--line)}
.badge.last{background:var(--card-accent,var(--accent));color:#fff;border-color:transparent}
.badge.missing{background:#fee2e2;color:#b91c1c;border-color:#fecaca}
.card h3{margin:2px 0 0;font-size:calc(var(--font-size) + 3px);line-height:1.4}
.card p{margin:0;font-size:calc(var(--font-size) - 2px);line-height:1.7;color:var(--muted);flex:1}
.card-foot{display:flex;align-items:center;justify-content:space-between;gap:8px;padding-top:9px;border-top:1px dashed var(--line);font-size:12px;color:var(--muted)}
.card-foot .open{color:var(--card-accent,var(--accent));font-weight:800;font-size:14px}
.card.missing{opacity:.62}
.empty{padding:22px;border:1px dashed var(--line);border-radius:12px;color:var(--muted);text-align:center;grid-column:1/-1}
.control-panel{border:1px solid var(--line);border-radius:18px;padding:14px;background:color-mix(in srgb,var(--paper) 88%,var(--soft));height:max-content;position:sticky;top:12px}
.panel-heading{display:flex;align-items:center;justify-content:space-between;margin-bottom:11px}
.panel-heading h3{margin:0;font-size:16px}
.panel-toggle{position:absolute;top:11px;right:-1px;transform:translateX(100%);width:38px;height:38px;padding:0;border-radius:0 11px 11px 0;display:grid;place-items:center;background:var(--accent);font-size:18px}
.nav-grid{display:grid;grid-template-columns:1fr;gap:7px}
.nav-btn{width:100%;display:flex;align-items:center;gap:10px;justify-content:flex-start;margin:0;background:transparent;color:var(--ink);border:1px solid var(--line)}
.nav-btn:hover{background:var(--soft);color:var(--accent);border-color:color-mix(in srgb,var(--accent) 40%,var(--line))}
.nav-icon{font-size:18px;width:24px;text-align:center}
.panel-note{font-size:12px;line-height:1.7;color:var(--muted);border-top:1px solid var(--line);margin-top:14px;padding-top:12px}
.modal-backdrop{position:fixed;inset:0;background:rgba(15,23,42,.45);display:none;align-items:center;justify-content:center;padding:18px;z-index:20}
.modal-backdrop.open{display:flex}
.modal{width:min(760px,100%);max-height:90vh;overflow:auto;background:var(--paper);border-radius:20px;box-shadow:0 25px 70px rgba(0,0,0,.25);padding:22px}
.modal-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}
.modal-head h2{margin:0;font-size:22px}
.close{background:transparent;color:var(--muted);font-size:24px;padding:3px 10px}
.modal-footer{margin-top:16px;display:flex;justify-content:flex-start;gap:9px}
.theme-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.theme-card{border:2px solid var(--line);background:var(--cell);color:var(--ink);padding:12px;border-radius:14px;text-align:right}
.theme-card.selected{border-color:var(--accent)}
.swatches{display:flex;gap:5px;margin-bottom:9px}
.swatches i{height:28px;flex:1;border-radius:6px}
.steps{margin:0;padding:0 20px 0 0;line-height:2}
.steps code{direction:ltr;unicode-bidi:isolate;background:var(--soft);padding:1px 7px;border-radius:6px;font-size:13px}
.stat-row{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px dashed var(--line)}
.status{min-height:20px;margin-top:10px;font-size:13px;color:var(--accent)}
body.panel-hidden .layout{grid-template-columns:1fr}
body.panel-hidden .control-panel{display:none}
body.panel-hidden .panel-toggle{position:fixed;right:0;top:50%;transform:translateY(-50%);border-radius:11px 0 0 11px;z-index:10}
@media(max-width:760px){
  body{padding:8px}
  .topbar{padding:16px;align-items:flex-start;flex-wrap:wrap}
  .date-box{text-align:right}
  .layout{padding:13px;display:block}
  .control-panel{position:static;margin-top:18px}
  .panel-toggle{right:12px;top:12px;transform:none;border-radius:11px}
  .brand-mark{width:38px;height:38px}
  .today{font-size:15px}
  .grid{grid-template-columns:1fr}
}
/* ---------- محادثة Claude ---------- */
.modal.chat-modal{width:min(820px,100%);height:88vh;max-height:860px;display:flex;flex-direction:column;overflow:hidden;padding:16px}
.chat-modal .modal-head{margin-bottom:8px}
.chat-modal .modal-head h2{font-size:19px}
.chat-wrap{display:flex;flex-direction:column;gap:10px;flex:1;min-height:0}
.chat-bar{display:flex;gap:8px;flex-wrap:wrap}
.chat-bar button{padding:7px 12px;font-size:13px}
.chat-list{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;gap:10px;padding:4px 2px}
.chat-empty{margin:auto;max-width:420px;text-align:center;color:var(--muted);line-height:1.9;font-size:14px}
.bubble{padding:11px 14px;border-radius:14px;line-height:1.9;font-size:calc(var(--font-size) + 1px);overflow-wrap:anywhere}
.bubble.user{align-self:flex-start;max-width:88%;background:var(--accent);color:#fff;white-space:pre-wrap}
.bubble.assistant{align-self:stretch;background:var(--soft);border:1px solid var(--line)}
.bubble.error{align-self:stretch;background:#fee2e2;color:#991b1b;border:1px solid #fecaca;white-space:pre-wrap;font-size:14px}
.bubble.typing{color:var(--muted)}
.bubble p{margin:0 0 .6em}
.bubble ul,.bubble ol{margin:0 0 .6em;padding:0 22px 0 0}
.bubble>*:last-child{margin-bottom:0}
.bubble pre{direction:ltr;text-align:left;overflow:auto;background:rgba(0,0,0,.08);padding:10px;border-radius:10px;margin:.4em 0;font-size:13px}
.bubble code{direction:ltr;unicode-bidi:isolate;font-size:.9em;background:rgba(0,0,0,.07);padding:1px 5px;border-radius:5px}
.bubble pre code{background:none;padding:0}
.md-h{font-weight:800;margin:.5em 0 .3em;color:var(--accent)}
.chat-compose{display:flex;gap:8px;align-items:flex-end}
.chat-input,.chat-field{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--cell);color:var(--ink);font:inherit;font-size:15px;outline:0}
.chat-input{flex:1;min-width:0;width:auto;resize:none;max-height:140px;line-height:1.6}
.chat-input:focus,.chat-field:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 20%,transparent)}
.chat-send{padding:11px 18px;white-space:nowrap}
.chat-send.stop{background:#b91c1c}
.chat-note{font-size:11px;color:var(--muted);text-align:center}
.chat-form label{display:block;margin:12px 0 5px;font-weight:700;font-size:14px}
.chat-form p{margin:6px 0;font-size:13px;line-height:1.8;color:var(--muted)}
.chat-form .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
@media(max-width:760px){.modal.chat-modal{width:100%;height:94vh;height:94dvh;padding:12px;border-radius:16px}}
</style>
</head>
<body>
<div class="app">
  <div class="paper">
    <header class="topbar">
      <div class="brand"><div class="brand-mark">📖</div><div><h1>القوارئ العشر</h1><p class="subtitle">مشروع القراء العشر — قارئ لكل مؤلف أو موضوع</p></div></div>
      <div class="date-box"><span class="date-label">تاريخ اليوم</span><span class="today" id="today"></span></div>
      <div class="font-control"><button class="font-button" type="button" onclick="toggleFontMenu()" title="التحكم في حجم الخط" aria-label="التحكم في حجم الخط">A</button><div class="font-menu" id="fontMenu"><span class="font-menu-title">حجم خط البطاقات</span><div class="font-actions"><button type="button" onclick="changeFontSize(-1)">−</button><span class="font-value" id="fontValue">15</span><button type="button" onclick="changeFontSize(1)">+</button></div></div></div>
    </header>
    <main class="layout">
      <section class="workspace">
        <div class="resume" id="resume"><div><b id="resumeTitle"></b><small id="resumeWhen"></small></div><button type="button" id="resumeBtn">تابع القراءة</button></div>
        <div class="section-title"><h2>اختر القارئ</h2><span class="hint" id="countHint"></span></div>
        <div class="search-row"><input id="q" type="search" placeholder="ابحث باسم القارئ أو المؤلف أو الموضوع…" autocomplete="off" aria-label="بحث في القوارئ"></div>
        <div class="grid" id="grid"></div>
        <div class="status" id="status" role="status"></div>
      </section>
      <aside class="control-panel" id="controlPanel">
        <div class="panel-heading"><h3>لوحة التحكم</h3><span>☰</span></div>
        <div class="nav-grid">
          <button class="nav-btn" type="button" onclick="openThemes()"><span class="nav-icon">◐</span>السيمات</button>
          <button class="nav-btn" type="button" onclick="openStats()"><span class="nav-icon">▦</span>إحصاءات المكتبة</button>
          <button class="nav-btn" type="button" onclick="openAdd()"><span class="nav-icon">✎</span>كيف أضيف أو أغيّر قارئاً</button>
          <button class="nav-btn" type="button" onclick="recheck()"><span class="nav-icon">⟳</span>إعادة فحص الملفات</button>
          <button class="nav-btn" type="button" onclick="openCloud()"><span class="nav-icon">☁</span>المزامنة السحابية</button>
          <button class="nav-btn" type="button" onclick="openChat()"><span class="nav-icon">💬</span>محادثة مع Claude</button>
        </div>
        <div class="panel-note">كل قارئ يحفظ علاماته وملاحظاته وتظليله ومكان توقفك على هذا المتصفح، وتُنسخ سحابياً عند تفعيل «المزامنة السحابية» لتظهر على أي جهاز.</div>
      </aside>
    </main>
  </div>
  <button class="panel-toggle" id="togglePanel" type="button" onclick="togglePanel()" title="إظهار أو إخفاء لوحة التحكم" aria-label="إظهار أو إخفاء لوحة التحكم">☰</button>
</div>

<div class="modal-backdrop" id="modalBackdrop" onclick="backdropClose(event)"><div class="modal" id="modal"></div></div>

<script src="cloud-config.js?v=1"></script>
<script src="cloud-sync.js?v=2"></script>
<script>
// ============================================================

const READERS=[

const themes={

 purple:{name:'لافندر',bg:'#f3f0fa',paper:'#fff',ink:'#30264b',accent:'#7c4dba',accent2:'#5e3294',line:'#d5c7e9',soft:'#f2eafd'},

 teal:{name:'بحري',bg:'#eaf5f6',paper:'#fff',ink:'#16383c',accent:'#087f8c',accent2:'#06636e',line:'#b8dfe1',soft:'#e1f5f7'},
 graphite:{name:'رمادي أنيق',bg:'#e9ecef',paper:'#fff',ink:'#20252b',accent:'#495057',accent2:'#343a40',line:'#c6cbd0',soft:'#edf0f2'},
 orange:{name:'مشمشي',bg:'#fff3eb',paper:'#fff',ink:'#492a1c',accent:'#e06d2d',accent2:'#bd4e17',line:'#f1c8b1',soft:'#fff0e6'},
 navy:{name:'كحلي',bg:'#e9eef7',paper:'#f8fafc',ink:'#16243b',accent:'#315b9d',accent2:'#20447d',line:'#bcc9df',soft:'#e8effb'},
 dark:{name:'ليلي',bg:'#111827',paper:'#1f2937',ink:'#f1f5f9',accent:'#60a5fa',accent2:'#3b82f6',line:'#475569',soft:'#263449',cell:'#182233'},
 sky:{name:'سماوي',bg:'#eaf4fc',paper:'#fff',ink:'#12324a',accent:'#0284c7',accent2:'#0369a1',line:'#bcd9ee',soft:'#e0f0fb'},
 olive:{name:'زيتوني',bg:'#f1f3e8',paper:'#fffffb',ink:'#2f3a1e',accent:'#6b7f2a',accent2:'#54651c',line:'#d3dab4',soft:'#eef2dc'},

function el(tag,props={},kids=[]){
  const n=document.createElement(tag);
  for(const [k,v] of Object.entries(props)){
    if(k==='class')n.className=v;
    else if(k==='text')n.textContent=v;
    else if(k.startsWith('on'))n.addEventListener(k.slice(2),v);
    else n.setAttribute(k,v);
  }
  [].concat(kids).forEach(c=>c&&n.appendChild(typeof c==='string'?document.createTextNode(c):c));
  return n;
}
const norm=s=>String(s||'').toLowerCase().replace(/[ً-ٰٟـ]/g,'').replace(/[أإآ]/g,'ا').replace(/ى/g,'ي').replace(/ة/g,'ه');
function getDetail(){try{const v=JSON.parse(store.get('readers_last_detail')||'null');return v&&v.file?v:null}catch{return null}}
function getLast(){
  let v=null;try{v=JSON.parse(store.get(K_LAST)||'null');if(!(v&&v.id))v=null}catch{v=null}
  // لو سجّل أحد القوارئ موضعاً أحدث (آخر كتاب وفقرة) نعتمده — ويحمل اسم الكتاب ورقم الفقرة
  const d=getDetail(),r=d&&READERS.find(x=>x.file.split('/').pop()===d.file);
  if(r&&(!v||d.ts>=v.ts))return {id:r.id,ts:d.ts,detail:d};
  if(v&&d&&READERS.find(x=>x.id===v.id)?.file.split('/').pop()===d.file)v.detail=d;
  return v;
}
function ago(ts){
  const m=Math.round((Date.now()-ts)/60000);
  if(m<1)return 'الآن';
  if(m<60)return `منذ ${m} دقيقة`;
  const h=Math.round(m/60);
  if(h<24)return `منذ ${h} ساعة`;
  return `منذ ${Math.round(h/24)} يوم`;
}

function render(){
  const q=norm(qEl.value.trim()),last=getLast();
  const list=READERS.filter(r=>!q||norm([r.title,r.sub,r.desc].join(' ')).includes(q));
  grid.replaceChildren();
  if(!list.length)grid.appendChild(el('div',{class:'empty',text:'لا توجد نتائج مطابقة للبحث.'}));
  list.forEach(r=>{
    const idx=READERS.indexOf(r)+1,missing=availability[r.id]===false;
    const badge=missing?el('span',{class:'badge missing',text:'الملف غير موجود'}):(last&&last.id===r.id?el('span',{class:'badge last',text:'آخر ما قرأت'}):el('span',{class:'badge',text:r.texts?`${r.texts} نصاً`:'فارغ'}));
    const a=el('a',{class:'card'+(missing?' missing':''),href:r.file,style:`--card-accent:${r.accent}`,'data-id':r.id,onclick:()=>markOpened(r)},[
      el('div',{class:'card-top'},[el('span',{class:'num',text:String(idx)}),badge]),

      el('p',{text:r.desc}),

function renderResume(){
  const last=getLast(),r=last&&READERS.find(x=>x.id===last.id),box=$('#resume');
  if(!r){box.classList.remove('show');return}
  $('#resumeTitle').textContent=r.title;

    ?['الكتاب: '+(d.title||'—'),d.pid?'الفقرة '+d.pid:'','آخر قراءة: '+ago(d.ts||last.ts)].filter(Boolean).join(' — ')

// ---------- فحص وجود الملفات (على الاستضافة فقط) ----------
async function checkFiles(){
  if(!/^https?:$/.test(location.protocol))return;
  statusEl.textContent='جارٍ فحص ملفات القوارئ…';
  await Promise.all(READERS.map(async r=>{
    try{
      const res=await fetch(r.file,{method:'HEAD',cache:'no-store'});
      availability[r.id]=res.ok;
    }catch{availability[r.id]=undefined}
  }));
  const missing=READERS.filter(r=>availability[r.id]===false).length;
  statusEl.textContent=missing?`⚠ ${missing} من الملفات غير موجودة في مجلد readers — راجع «كيف أضيف أو أغيّر قارئاً».`:'';
  render();
}
function recheck(){availability={};render();checkFiles()}

// عرض Markdown مبسّط وآمن (بناء عناصر DOM بـ textContent فقط، بلا innerHTML)
function mdInline(text,parent){
  const re=/(\*\*[^*]+\*\*|`[^`]+`|\*[^*\n]+\*)/g;let last=0,m;
  while((m=re.exec(text))){
    if(m.index>last)parent.appendChild(document.createTextNode(text.slice(last,m.index)));
    const t=m[0];
    if(t.startsWith('**'))parent.appendChild(el('b',{text:t.slice(2,-2)}));
    else if(t[0]==='`')parent.appendChild(el('code',{text:t.slice(1,-1)}));
    else parent.appendChild(el('i',{text:t.slice(1,-1)}));
    last=m.index+t.length;
  }
  if(last<text.length)parent.appendChild(document.createTextNode(text.slice(last)));
}
function mdRender(src,box){
  box.replaceChildren();
  const lines=String(src).split('\n');let i=0,list=null,listType='';
  while(i<lines.length){
    const ln=lines[i];let m;
    if(/^```/.test(ln)){
      list=null;const buf=[];i++;
      while(i<lines.length&&!/^```/.test(lines[i])){buf.push(lines[i]);i++}
      i++;box.appendChild(el('pre',{},[el('code',{text:buf.join('\n')})]));continue;
    }
    if((m=ln.match(/^#{1,4}\s+(.*)/))){list=null;const h=el('div',{class:'md-h'});mdInline(m[1],h);box.appendChild(h)}
    else if((m=ln.match(/^\s*[-*•]\s+(.*)/))){
      if(!list||listType!=='ul'){list=el('ul');listType='ul';box.appendChild(list)}
      const li=el('li');mdInline(m[1],li);list.appendChild(li);
    }else if((m=ln.match(/^\s*\d+[.)]\s+(.*)/))){
      if(!list||listType!=='ol'){list=el('ol');listType='ol';box.appendChild(list)}
      const li=el('li');mdInline(m[1],li);list.appendChild(li);
    }else if(!ln.trim()){list=null}
    else{list=null;const p=el('p');mdInline(ln,p);box.appendChild(p)}
    i++;
  }
}

// بثّ الرد من واجهة Anthropic (SSE) — يستدعي onDelta لكل جزء نصّي
async function claudeStream(messages,onDelta,signal){
  const key=store.get(K_CKEY),model=store.get(K_CMODEL)||CHAT_MODELS[0].id;
  const res=await fetch('https://api.anthropic.com/v1/messages',{
    method:'POST',signal,
    headers:{'content-type':'application/json','x-api-key':key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
    body:JSON.stringify({model,max_tokens:4096,system:store.get(K_CSYS)||CHAT_SYS_DEFAULT,messages,stream:true})
  });
  if(!res.ok){
    let m='';try{const j=await res.json();m=(j.error&&j.error.message)||''}catch{}
    const base=res.status===401?'المفتاح غير صالح أو ملغى — افتح ⚙ الإعدادات وتحقق منه.'
      :res.status===429?'تجاوزت حد الطلبات — أعد المحاولة بعد قليل.'
      :res.status>=500?'خدمة Anthropic مشغولة حالياً — أعد المحاولة.'
      :'رفض الخادم الطلب ('+res.status+').';
    throw new Error(base+(m?'\n'+m:''));
  }
  const rd=res.body.getReader(),dec=new TextDecoder();let buf='';
  for(;;){
    const {done,value}=await rd.read();if(done)break;
    buf+=dec.decode(value,{stream:true}).replace(/\r\n/g,'\n');
    let i;
    while((i=buf.indexOf('\n\n'))>=0){
      const block=buf.slice(0,i);buf=buf.slice(i+2);
      const line=block.split('\n').find(l=>l.startsWith('data:'));if(!line)continue;
      let ev;try{ev=JSON.parse(line.slice(5).trim())}catch{continue}
      if(ev.type==='content_block_delta'&&ev.delta&&ev.delta.type==='text_delta')onDelta(ev.delta.text);
      else if(ev.type==='error')throw new Error((ev.error&&ev.error.message)||'خطأ من الخادم أثناء البث.');
    }
  }
}

function openChat(){
  loadChat();
  if(!store.get(K_CKEY)){openChatSettings(true);return}
  const list=el('div',{class:'chat-list'});
  const ta=el('textarea',{class:'chat-input',rows:'1',placeholder:'اكتب سؤالك لـ Claude…','aria-label':'رسالة'});
  const sendBtn=el('button',{type:'button',class:'chat-send',text:'إرسال'});
  const scroll=()=>{list.scrollTop=list.scrollHeight};
  const autosize=()=>{ta.style.height='auto';ta.style.height=Math.min(ta.scrollHeight,140)+'px'};
  const setBusy=b=>{sendBtn.textContent=b?'إيقاف':'إرسال';sendBtn.classList.toggle('stop',b)};
  const addBubble=(role,text)=>{
    const e=list.querySelector('.chat-empty');if(e)e.remove();
    const b=el('div',{class:'bubble '+role});
    if(role==='assistant')mdRender(text,b);else b.textContent=text;
    list.appendChild(b);return b;
  };
  const buildMessages=()=>{
    const msgs=chatHist.slice(-CHAT_MAX_SEND);
    while(msgs.length&&msgs[0].role!=='user')msgs.shift();
    return msgs;
  };

  async function send(){
    const text=ta.value.trim();if(!text||chatAbort)return;
    const epoch=chatEpoch;
    ta.value='';autosize();
    chatHist.push({role:'user',content:text});addBubble('user',text);
    const out=addBubble('assistant','');out.classList.add('typing');out.textContent='…';scroll();
    const ac=new AbortController();chatAbort=ac;setBusy(true);
    let acc='',raf=0;
    const paint=()=>{raf=0;mdRender(acc,out);scroll()};
    try{
      await claudeStream(buildMessages(),d=>{acc+=d;out.classList.remove('typing');if(!raf)raf=requestAnimationFrame(paint)},ac.signal);
      if(raf)cancelAnimationFrame(raf);
      if(!acc.trim())throw new Error('وصل رد فارغ — أعد المحاولة.');
      mdRender(acc,out);scroll();
      if(epoch===chatEpoch){chatHist.push({role:'assistant',content:acc});saveChat()}
    }catch(e){
      if(raf)cancelAnimationFrame(raf);
      if(epoch!==chatEpoch)return;
      if(e&&e.name==='AbortError'&&acc.trim()){
        mdRender(acc,out);chatHist.push({role:'assistant',content:acc});saveChat();
      }else{
        chatHist.pop();            // نُسقط رسالتك من السجل ونعيدها للمربع لتعيد الإرسال
        out.remove();ta.value=text;autosize();
        const msg=e&&e.name==='AbortError'?'تم إيقاف الإرسال.':(e instanceof TypeError?'تعذّر الاتصال بـ Anthropic — تحقق من الإنترنت.':(e&&e.message)||'حدث خطأ غير متوقع.');
        addBubble('error',msg);scroll();
      }
    }finally{
      if(chatAbort===ac)chatAbort=null;
      setBusy(false);
    }
  }

  sendBtn.onclick=()=>{if(chatAbort)chatAbort.abort();else send()};
  ta.addEventListener('input',autosize);
  ta.addEventListener('keydown',e=>{
    const coarse=window.matchMedia&&matchMedia('(pointer:coarse)').matches;
    if(e.key==='Enter'&&!e.shiftKey&&!coarse){e.preventDefault();send()}
  });

  const bar=el('div',{class:'chat-bar'},[
    el('button',{type:'button',class:'ghost',text:'⚙ الإعدادات',onclick:()=>{if(!chatAbort)openChatSettings(false)}}),
    el('button',{type:'button',class:'ghost',text:'🗑 محادثة جديدة',onclick:()=>{
      if(chatHist.length&&!confirm('سيُمسح سجل هذه المحادثة من هذا الجهاز. متابعة؟'))return;
      chatEpoch++;if(chatAbort)chatAbort.abort();chatHist=[];saveChat();openChat();
    }})
  ]);
  openModal('محادثة مع Claude',el('div',{class:'chat-wrap'},[
    bar,list,
    el('div',{class:'chat-compose'},[ta,sendBtn]),
    el('div',{class:'chat-note',text:'السجل محفوظ على هذا الجهاز فقط. Claude قد يخطئ — راجع أي اقتباس على المصدر.'})
  ]),el('div'));
  modal.classList.add('chat-modal');
  if(chatHist.length)chatHist.forEach(m=>addBubble(m.role,m.content));
  else list.appendChild(el('div',{class:'chat-empty',text:'اسأل Claude عن أي نص أو فكرة في مكتبتك. الإجابات تُبثّ مباشرة هنا دون الحاجة لفتح تطبيق Claude.'}));
  scroll();
}

function openChatSettings(first){
  const cur=store.get(K_CMODEL)||CHAT_MODELS[0].id;
  const key=el('input',{type:'password',class:'chat-field',dir:'ltr',autocomplete:'off',spellcheck:'false',placeholder:'sk-ant-…',value:store.get(K_CKEY)||''});
  const sel=el('select',{class:'chat-field'},CHAT_MODELS.map(m=>{const o=el('option',{value:m.id,text:m.name});if(m.id===cur)o.selected=true;return o}));
  const sys=el('textarea',{class:'chat-field',rows:'5'});sys.value=store.get(K_CSYS)||CHAT_SYS_DEFAULT;
  const msg=el('div',{class:'status',role:'status'});
  const body=el('div',{class:'chat-form'},[
    el('p',{text:first?'للربط المباشر مع Claude أدخل مفتاح API مرة واحدة على هذا الجهاز.':'إعدادات المحادثة'}),
    el('p',{text:'أنشئ المفتاح من console.anthropic.com ← API Keys. الفوترة منفصلة عن اشتراك تطبيق Claude، فاضبط حداً شهرياً للإنفاق هناك.'}),
    el('p',{text:'يُحفظ المفتاح على هذا الجهاز فقط؛ لا يُرفع إلى GitHub ولا إلى المزامنة السحابية، فأدخله مرة في كل جهاز تستخدمه.'}),
    el('label',{text:'مفتاح API'}),key,
    el('label',{text:'النموذج'}),sel,
    el('label',{text:'تعليمات النظام (اختياري)'}),sys,
    el('div',{class:'row'},[
      el('button',{type:'button',text:'حفظ',onclick:()=>{
        const k=key.value.trim();
        if(!/^[\x21-\x7E]{20,}$/.test(k)){msg.textContent='المفتاح غير صالح — ألصقه كما هو من الكونسول (أحرف إنجليزية بلا مسافات).';return}
        store.set(K_CKEY,k);store.set(K_CMODEL,sel.value);
        const s=sys.value.trim();store.set(K_CSYS,s&&s!==CHAT_SYS_DEFAULT?s:'');
        openChat();
      }}),
      el('button',{type:'button',class:'secondary',text:'استعادة التعليمات الافتراضية',onclick:()=>{sys.value=CHAT_SYS_DEFAULT}}),
      el('button',{type:'button',class:'secondary',text:'حذف المفتاح من هذا الجهاز',onclick:()=>{
        if(confirm('سيُحذف المفتاح من هذا الجهاز. متابعة؟')){try{localStorage.removeItem(K_CKEY)}catch{}key.value='';msg.textContent='✓ حُذف المفتاح.'}
      }}),
      !first&&el('button',{type:'button',class:'ghost',text:'رجوع للمحادثة',onclick:()=>{if(store.get(K_CKEY))openChat();else closeModal()}})
    ]),
    msg
  ]);
  openModal('محادثة مع Claude',body);
}

function openAdd(){
  const li=t=>el('li',{},[t]);
  const code=t=>el('code',{text:t});
  const body=el('div',{},[
    el('ol',{class:'steps'},[
      el('li',{},['ضع ملف كل قارئ داخل مجلد ',code('readers'),' بجانب ',code('index.html'),' (المستودع نفسه على GitHub).']),
      li('أسماء الملفات المتوقعة مكتوبة في القائمة READERS أعلى الكود في index.html (حقل file).'),
      li('لتغيير اسم قارئ أو وصفه أو لونه أو عدد نصوصه: عدّل سطره في تلك القائمة فقط.'),
      li('لإضافة قارئ جديد: انسخ سطراً كاملاً وغيّر id وtitle وfile.'),
      li('الملفات الأكبر من 25 ميجا لا يقبلها GitHub عبر الواجهة؛ استخدم الرفع من تطبيق Git أو GitHub Desktop.')
    ])
  ]);
  openModal('كيف أضيف أو أغيّر قارئاً',body);
}
